<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>VÉLO — Suggestions review</title>
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<script src="assets/vendor/supabase.js"></script>
<script src="assets/velo-config.js"></script>
<style>
:root{--ink:#0F172A;--accent:#F97316;--accent-hover:#EA580C;--g50:#F9FAFB;--g100:#F3F4F6;--g200:#E5E7EB;--g400:#9CA3AF;--g500:#6B7280;--g700:#374151;--g900:#111827;
 --easy:#059669;--hard:#DC2626;--teal:#0D9488;--road:#3B82F6;--gravel:#D97706;--violet:#8B5CF6;--r:10px;--r-lg:14px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--g50);color:var(--g900);-webkit-font-smoothing:antialiased}
.topbar{background:var(--ink);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
.topbar h1{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.06em;font-size:19px;font-weight:700}
.topbar h1 span{color:rgba(255,255,255,.5);font-weight:600}
.topbar .sp{flex:1}
.topbar button{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:6px 14px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
.wrap{max-width:820px;margin:0 auto;padding:24px 16px 60px}
.card{background:#fff;border:1px solid var(--g200);border-radius:var(--r-lg);padding:18px 20px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.login{max-width:400px;margin:10vh auto;text-align:center}
.login h2{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.02em;font-size:26px;margin-bottom:6px}
.login p{color:var(--g500);font-size:13px;margin-bottom:18px}
.login input{width:100%;padding:11px 13px;border:1px solid var(--g200);border-radius:var(--r);font-size:14px;margin-bottom:10px;font-family:inherit}
.login input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(249,115,22,.2)}
.btn{background:var(--accent);color:#fff;border:none;border-radius:var(--r);padding:11px 18px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;width:100%}
.btn:hover{background:var(--accent-hover)}
.btn.sm{width:auto;padding:8px 14px;font-size:13px}
.btn.ghost{background:#fff;color:var(--g700);border:1px solid var(--g200)}
.btn.green{background:var(--easy)}.btn.red{background:var(--hard)}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{padding:8px 16px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;background:#fff;border:1px solid var(--g200);color:var(--g500)}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:2px 8px;border-radius:6px}
.b-coffee{background:rgba(249,115,22,.12);color:var(--accent)} .b-food{background:rgba(234,179,8,.15);color:#a16207}
.b-hire{background:rgba(13,148,136,.12);color:var(--teal)} .b-stay{background:rgba(139,92,246,.12);color:var(--violet)} .b-view{background:rgba(59,130,246,.12);color:var(--road)}
.sug h3{font-size:16px;margin:6px 0 3px}
.sug .desc{font-size:13.5px;color:var(--g700);line-height:1.5;margin:6px 0}
.sug .meta{font-size:12px;color:var(--g500);display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}
.sug .meta a{color:var(--teal)}
.sug .acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.tagrow{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:10.5px;color:var(--g500);background:var(--g100);border-radius:999px;padding:2px 8px}
.empty{text-align:center;color:var(--g400);padding:50px 20px}
pre{background:var(--ink);color:#e2e8f0;border-radius:var(--r);padding:12px;font-size:11.5px;overflow-x:auto;margin-top:10px;white-space:pre-wrap;word-break:break-word;display:none}
.msg{font-size:13px;padding:9px 12px;border-radius:var(--r);margin-top:10px}
.msg.err{background:rgba(220,38,38,.1);color:var(--hard)} .msg.ok{background:rgba(5,150,105,.1);color:var(--easy)}
</style>
</head>
<body>
<div class="topbar"><h1>VÉLO <span>· Suggestions</span></h1><div class="sp"></div><button id="signout" hidden>Sign out</button></div>

<div id="loginView" class="wrap" hidden>
  <div class="login">
    <h2>Review sign-in</h2>
    <p>Owner access only. Sign in to review suggested places.</p>
    <input id="email" type="email" placeholder="Email" autocomplete="username">
    <input id="password" type="password" placeholder="Password" autocomplete="current-password">
    <button class="btn" id="loginBtn">Sign in</button>
    <div id="loginMsg"></div>
  </div>
</div>

<div id="queueView" class="wrap" hidden>
  <div class="tabs" style="margin-bottom:20px">
    <div class="tab on modetab" data-mode="places">📍 Places</div>
    <div class="tab modetab" data-mode="routes">🚴 Routes</div>
  </div>
  <div class="tabs">
    <div class="tab on" data-status="pending">Pending</div>
    <div class="tab" data-status="approved">Approved</div>
    <div class="tab" data-status="rejected">Rejected</div>
  </div>
  <div id="list"></div>
</div>

<script>
const CATS={coffee:'Coffee stop',food:'Food & drink',hire:'Bike hire / shop',stay:'Accommodation',view:'Landmark'};
let SB=null, curStatus='pending', curMode='places';
try{ SB=window.supabase.createClient(VELO_SUPABASE.url, VELO_SUPABASE.key); }catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function boot(){
  const {data:{session}}=await SB.auth.getSession();
  if(session){ showQueue(); } else { $('loginView').hidden=false; }
}
$('loginBtn').onclick=async()=>{
  const m=$('loginMsg'); m.className=''; m.textContent='';
  const {error}=await SB.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});
  if(error){ m.className='msg err'; m.textContent=error.message; return; }
  showQueue();
};
$('signout').onclick=async()=>{ await SB.auth.signOut(); location.reload(); };
document.querySelectorAll('.tab[data-status]').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab[data-status]').forEach(x=>x.classList.remove('on')); t.classList.add('on');
  curStatus=t.dataset.status; load();
});
document.querySelectorAll('.modetab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.modetab').forEach(x=>x.classList.remove('on')); t.classList.add('on');
  curMode=t.dataset.mode; load();
});
function showQueue(){ $('loginView').hidden=true; $('queueView').hidden=false; $('signout').hidden=false; load(); }

async function load(){
  const list=$('list'); list.innerHTML='<div class="empty">Loading…</div>';
  const table=curMode==='routes'?'route_suggestions':'place_suggestions';
  const {data,error}=await SB.from(table).select('*').eq('status',curStatus).order('created_at',{ascending:false});
  if(error){ list.innerHTML='<div class="empty">'+esc(error.message)+'</div>'; return; }
  if(!data.length){ list.innerHTML='<div class="empty">Nothing '+curStatus+'.</div>'; return; }
  list.innerHTML='';
  data.forEach(s=>list.appendChild(curMode==='routes'?routeCard(s):card(s)));
}
function card(s){
  const d=document.createElement('div'); d.className='card sug';
  const when=new Date(s.created_at).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
  const tags=(s.tags||'').split(',').map(t=>t.trim()).filter(Boolean).map(t=>`<span class="tag">${esc(t)}</span>`).join('');
  d.innerHTML=`
    <span class="badge b-${s.category}">${CATS[s.category]||s.category}</span>
    <h3>${esc(s.name)}</h3>
    ${s.desc?'':''}${s.description?`<div class="desc">${esc(s.description)}</div>`:''}
    ${tags?`<div class="tagrow">${tags}</div>`:''}
    <div class="meta">
      <span>📍 <a href="https://www.google.com/maps?q=${s.lat},${s.lng}" target="_blank" rel="noopener">${s.lat.toFixed(5)}, ${s.lng.toFixed(5)}</a></span>
      ${s.url?`<span>🔗 <a href="${esc(s.url)}" target="_blank" rel="noopener">website</a></span>`:''}
      ${s.route_context?`<span>🚴 on “${esc(s.route_context)}”</span>`:''}
      ${s.submitter_name?`<span>✍ ${esc(s.submitter_name)}${s.submitter_contact?' ('+esc(s.submitter_contact)+')':''}</span>`:''}
      <span>${when}</span>
    </div>
    <div class="acts">
      ${curStatus!=='approved'?'<button class="btn sm green" data-act="approved">✓ Approve</button>':''}
      ${curStatus!=='rejected'?'<button class="btn sm red" data-act="rejected">✕ Reject</button>':''}
      ${curStatus!=='pending'?'<button class="btn sm ghost" data-act="pending">↩ Back to pending</button>':''}
      <button class="btn sm ghost" data-act="poi">⧉ Copy POI code</button>
      <button class="btn sm ghost" data-act="del">🗑 Delete</button>
    </div>
    <pre></pre>`;
  d.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(s,b.dataset.act,d));
  return d;
}
const TYPE_LABEL={road:'Road',gravel:'Gravel',path:'Path'};
function routeShapeSvg(pts){
  if(!pts||pts.length<2) return '';
  const lats=pts.map(p=>p[0]), lngs=pts.map(p=>p[1]);
  const mnLa=Math.min(...lats),mxLa=Math.max(...lats),mnLo=Math.min(...lngs),mxLo=Math.max(...lngs);
  const W=560,H=170,pad=12;
  const sx=(mxLo-mnLo)||1e-6, sy=(mxLa-mnLa)||1e-6;
  const sc=Math.min((W-2*pad)/sx,(H-2*pad)/sy);
  const w=sx*sc, h=sy*sc, ox=(W-w)/2, oy=(H-h)/2;
  const d=pts.map((p,i)=>{const x=ox+(p[1]-mnLo)*sc; const y=oy+(mxLa-p[0])*sc; return (i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1);}).join(' ');
  const s=pts[0],e=pts[pts.length-1];
  const sX=ox+(s[1]-mnLo)*sc,sY=oy+(mxLa-s[0])*sc,eX=ox+(e[1]-mnLo)*sc,eY=oy+(mxLa-e[0])*sc;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;background:var(--g100);border-radius:10px;margin-top:10px">
    <path d="${d}" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="${d}" fill="none" stroke="#F97316" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${sX.toFixed(1)}" cy="${sY.toFixed(1)}" r="5" fill="#059669" stroke="#fff" stroke-width="2"/>
    <circle cx="${eX.toFixed(1)}" cy="${eY.toFixed(1)}" r="5" fill="#DC2626" stroke="#fff" stroke-width="2"/>
  </svg>`;
}
function routeCard(s){
  const d=document.createElement('div'); d.className='card sug';
  const when=new Date(s.created_at).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
  const pts=Array.isArray(s.pts)?s.pts:[];
  const start=pts.length?pts[0]:null;
  const badgeCls=s.type==='gravel'?'b-food':(s.type==='path'?'b-hire':'b-view');
  d.innerHTML=`
    <span class="badge ${badgeCls}">${TYPE_LABEL[s.type]||s.type}</span>
    <h3>${esc(s.name)}</h3>
    ${routeShapeSvg(pts)}
    <div class="meta">
      <span><b>${s.dist!=null?(+s.dist).toFixed(1):'?'}</b> km</span>
      <span>↑ <b>${s.ascent!=null?Math.round(s.ascent):'?'}</b> m</span>
      <span>${pts.length} pts</span>
      ${start?`<span>📍 <a href="https://www.google.com/maps?q=${start[0]},${start[1]}" target="_blank" rel="noopener">start</a></span>`:''}
      ${s.submitter_name?`<span>✍ ${esc(s.submitter_name)}${s.submitter_contact?' ('+esc(s.submitter_contact)+')':''}</span>`:''}
      <span>${when}</span>
    </div>
    ${s.note?`<div class="desc">${esc(s.note)}</div>`:''}
    <div class="acts">
      ${curStatus!=='approved'?'<button class="btn sm green" data-act="approved">✓ Approve</button>':''}
      ${curStatus!=='rejected'?'<button class="btn sm red" data-act="rejected">✕ Reject</button>':''}
      ${curStatus!=='pending'?'<button class="btn sm ghost" data-act="pending">↩ Back to pending</button>':''}
      <button class="btn sm ghost" data-act="gpx">⭳ GPX</button>
      <button class="btn sm ghost" data-act="code">⧉ Copy curated.json entry</button>
      <button class="btn sm ghost" data-act="del">🗑 Delete</button>
    </div>
    <pre></pre>`;
  d.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>routeAct(s,b.dataset.act,d));
  return d;
}
function slugify(str){ return (str||'route').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,32); }
function curatedCode(s){
  const pts=Array.isArray(s.pts)?s.pts:[];
  const dist=s.dist!=null?Math.round(+s.dist):0;
  const time=dist>=70?'day':(dist>=35?'3':'2');
  const surf=s.type==='gravel'?'Gravel and unpaved tracks':(s.type==='path'?'Traffic-free paths and promenade':'Quiet roads and lanes');
  const color=s.type==='gravel'?'#D97706':(s.type==='path'?'#8B5CF6':'#3B82F6');
  const o={ id:slugify(s.name), name:s.name, type:s.type||'road', time, dist,
    ascent:s.ascent!=null?Math.round(s.ascent):0, diff:'Moderate',
    surfaceTxt:surf, summary:s.note||'Community-submitted route.', desc:'',
    color, stops:[], source:'Community submission', pts };
  // pretty print but keep pts on one line
  const ptsStr=JSON.stringify(o.pts);
  const head=JSON.stringify({...o,pts:'__PTS__'},null,2).replace('"__PTS__"',ptsStr);
  return head+',';
}
async function routeAct(s,a,el){
  if(a==='code'){ const p=el.querySelector('pre'); p.textContent=curatedCode(s); p.style.display='block';
    try{navigator.clipboard.writeText(curatedCode(s));}catch(e){} return; }
  if(a==='gpx'){ downloadRouteGpx(s); return; }
  if(a==='del'){ if(!confirm('Delete this route permanently?'))return;
    const {error}=await SB.from('route_suggestions').delete().eq('id',s.id);
    if(error){alert(error.message);return;} el.remove(); return; }
  const {error}=await SB.from('route_suggestions').update({status:a}).eq('id',s.id);
  if(error){ alert(error.message); return; }
  el.style.opacity=.4; setTimeout(load,250);
}
function downloadRouteGpx(s){
  const pts=Array.isArray(s.pts)?s.pts:[]; if(pts.length<2) return;
  const seg=pts.map(p=>`      <trkpt lat="${p[0]}" lon="${p[1]}"></trkpt>`).join('\n');
  const gpx=`<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="VÉLO Mar Menor" xmlns="http://www.topografix.com/GPX/1/1">\n  <metadata><name>${esc(s.name)}</name></metadata>\n  <trk><name>${esc(s.name)}</name><type>${s.type}</type><trkseg>\n${seg}\n  </trkseg></trk>\n</gpx>`;
  const blob=new Blob([gpx],{type:'application/gpx+xml'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=slugify(s.name)+'.gpx';a.click();URL.revokeObjectURL(a.href);
}
function poiCode(s){
  const id=(s.name||'place').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,28);
  const tags=(s.tags||'').split(',').map(t=>t.trim()).filter(Boolean);
  const o={id, cat:s.category, name:s.name, lat:+s.lat.toFixed(5), lng:+s.lng.toFixed(5),
    desc:s.description||'', tags, url:s.url||''};
  return '{id:'+JSON.stringify(o.id)+', cat:'+JSON.stringify(o.cat)+', name:'+JSON.stringify(o.name)+
    ', lat:'+o.lat+', lng:'+o.lng+',\n   desc:'+JSON.stringify(o.desc)+
    ',\n   tags:'+JSON.stringify(o.tags)+', url:'+JSON.stringify(o.url)+'},';
}
async function act(s,a,el){
  if(a==='poi'){ const p=el.querySelector('pre'); p.textContent=poiCode(s); p.style.display='block';
    try{navigator.clipboard.writeText(poiCode(s));}catch(e){} return; }
  if(a==='del'){ if(!confirm('Delete this suggestion permanently?'))return;
    const {error}=await SB.from('place_suggestions').delete().eq('id',s.id);
    if(error){alert(error.message);return;} el.remove(); return; }
  const {error}=await SB.from('place_suggestions').update({status:a}).eq('id',s.id);
  if(error){ alert(error.message); return; }
  el.style.opacity=.4; setTimeout(load,250);
}
if(!SB){ $('loginView').hidden=false; $('loginMsg').className='msg err'; $('loginMsg').textContent='Config missing.'; }
else boot();
</script>
</body>
</html>
