<!DOCTYPE html>
<html lang="en-GB">
<head>
<!-- Some interface icons are taken from or adapted from Feather (https://feathericons.com), MIT License, Copyright (c) 2013-2023 Cole Bemis. Full notices: assets/THIRD-PARTY-NOTICES.txt -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="theme-color" content="#0F172A">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VÉLO Coach">
<title>VÉLO Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<script src="assets/vendor/supabase.js"></script>
<script src="assets/velo-config.js"></script>
<script src="assets/coach-engine.js"></script>
<style>
:root{
  --white:#fff; --gray-50:#F9FAFB; --gray-100:#F3F4F6; --gray-200:#E5E7EB; --gray-300:#D1D5DB;
  --gray-400:#9CA3AF; --gray-500:#6B7280; --gray-600:#4B5563; --gray-700:#374151; --gray-800:#1F2937; --gray-900:#111827;
  --accent:#F97316; --accent-hover:#EA580C; --accent-light:rgba(249,115,22,.08); --accent-ring:rgba(249,115,22,.25);
  --ink:#0F172A; --ink-2:#1E293B;
  --good:#0ca30c; --good-text:#006300; --warn:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --s-fit:#2a78d6; --s-fat:#eb6834;
  --grid:#E5E7EB; --axis:#CBD5E1; --muted:#6B7280;
  --shadow-sm:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow:0 4px 6px -1px rgba(0,0,0,.07),0 2px 4px -2px rgba(0,0,0,.04);
  --r:10px; --r-lg:14px; --r-xl:18px;
  --font-d:'Barlow Condensed','Inter',system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}}
html{-webkit-text-size-adjust:100%}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--gray-900);background:var(--gray-100);
  -webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font:inherit;color:inherit}
a{color:var(--accent-hover);text-decoration:none}
a:hover{text-decoration:underline}
.num{font-variant-numeric:tabular-nums}

/* header */
.hdr{position:sticky;top:0;z-index:50;height:56px;display:flex;align-items:center;gap:14px;padding:0 20px;background:var(--ink);color:#fff}
.back{display:flex;align-items:center;gap:6px;color:rgba(255,255,255,.65);font-size:13px;font-weight:500;padding:6px 8px;margin-left:-8px;border-radius:8px}
.back:hover{color:#fff;background:rgba(255,255,255,.07);text-decoration:none}
.back svg{width:18px;height:18px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;border-radius:10px;flex:none;background:linear-gradient(135deg,#F97316,#EA580C);display:grid;place-items:center;box-shadow:0 2px 8px rgba(249,115,22,.35)}
.logo svg{width:20px;height:20px}
.title{font-family:var(--font-d);font-size:20px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.title span{font-weight:500;color:rgba(255,255,255,.55)}
.tabs{display:flex;gap:2px;margin-left:24px}
.tab{display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:var(--r);font-size:13.5px;font-weight:500;color:rgba(255,255,255,.6);position:relative}
.tab svg{width:18px;height:18px}
.tab:hover{color:#fff;background:rgba(255,255,255,.07)}
.tab[aria-selected="true"]{color:#FB923C;font-weight:600}
.tab[aria-selected="true"]::after{content:'';position:absolute;bottom:-11px;left:12px;right:12px;height:2px;background:var(--accent);border-radius:1px}
.sync{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:rgba(255,255,255,.6);white-space:nowrap}
.sync button{display:grid;place-items:center;width:34px;height:34px;border-radius:999px;border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.85)}
.sync button:hover{background:rgba(255,255,255,.08);color:#fff}
.sync button svg{width:16px;height:16px}
.sync.busy button svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bnav{display:none}

/* layout */
main{max-width:1120px;margin:0 auto;padding:22px 20px 60px}
.view{display:none}
.view.on{display:block}
.grid{display:grid;gap:16px}
.g-today{grid-template-columns:minmax(0,3fr) minmax(0,2fr);align-items:start}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
.setup-col{max-width:720px;margin:0 auto}
.stack{display:grid;gap:16px}
.card{background:var(--white);border:1px solid var(--gray-200);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);padding:18px 18px}
.card h2{font-family:var(--font-d);font-size:15px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gray-500);margin-bottom:12px}
.card h3{font-size:15px;font-weight:700;margin-bottom:6px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--gray-500)}
.muted{color:var(--gray-500)}
.small{font-size:13px}
.xs{font-size:12px}
p+p{margin-top:8px}
.sep{height:1px;background:var(--gray-200);margin:14px 0}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}

/* buttons & chips */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 14px;border-radius:var(--r);font-size:13.5px;font-weight:600;
  border:1px solid var(--gray-300);background:var(--white);color:var(--gray-800);transition:background .15s,border-color .15s}
.btn:hover{background:var(--gray-50);border-color:var(--gray-400)}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn-ghost{border-color:transparent;background:transparent;color:var(--gray-600)}
.btn-ghost:hover{background:var(--gray-100);border-color:transparent}
.btn-danger{color:#B91C1C;border-color:#FCA5A5}
.btn[disabled]{opacity:.55;cursor:default}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--gray-100);color:var(--gray-600);white-space:nowrap}
.chip.gym{background:#EEF2FF;color:#4338CA}
.chip.key{background:var(--accent-light);color:var(--accent-hover)}
.chip.done{background:#ECFDF3;color:var(--good-text)}
.chip.miss{background:#FEF2F2;color:#B91C1C}
.chip svg{width:12px;height:12px}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}

/* today hero */
.hero{padding:0;overflow:hidden}
.hero-top{background:var(--ink);color:#fff;padding:18px 18px 16px}
.hero-top .eyebrow{color:rgba(255,255,255,.55)}
.hero-name{font-family:var(--font-d);font-size:34px;line-height:1.05;font-weight:700;letter-spacing:.01em;margin-top:6px}
.hero-meta{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px}
.hero-meta div{display:flex;flex-direction:column}
.hero-meta b{font-size:20px;font-weight:700}
.hero-meta span{font-size:11.5px;color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:.05em;margin-top:1px}
.hero-body{padding:16px 18px 18px}
.why{font-size:14px;color:var(--gray-700);line-height:1.5}
.note{margin-top:10px;padding:10px 12px;border-radius:var(--r);background:var(--accent-light);color:var(--gray-800);font-size:13px;line-height:1.45}
.note.info{background:#EFF6FF}
.note.warn{background:#FFFBEB}

/* workout profile */
.prof-wrap{position:relative;margin-top:14px}
.prof{display:block;width:100%;height:96px;background:var(--gray-50);border-radius:8px}
.prof-mini{display:block;width:76px;height:24px;flex:none}
.ftp-tag{position:absolute;right:6px;font-size:10.5px;font-weight:600;color:var(--gray-500);background:rgba(249,250,251,.9);padding:0 4px;border-radius:4px;transform:translateY(-50%)}
.prof-axis{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px}
.steps{margin-top:14px;display:grid;gap:10px}
.steps h4{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--gray-500);margin-bottom:4px}
.steps ul{list-style:none;display:grid;gap:3px}
.steps li{display:grid;grid-template-columns:64px 1fr auto;gap:10px;font-size:13.5px;padding:4px 0;border-bottom:1px solid var(--gray-100)}
.steps li .w{font-weight:600}
.steps li .c{color:var(--gray-500);font-size:12.5px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}

/* readiness */
.form-big{display:flex;align-items:baseline;gap:10px}
.form-big b{font-size:40px;font-weight:800;letter-spacing:-.02em;line-height:1}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.status .ico{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:800}
.checkin{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.checkin button{height:40px;border-radius:var(--r);border:1px solid var(--gray-200);background:var(--white);font-size:13px;font-weight:600;color:var(--gray-700)}
.checkin button:hover{border-color:var(--gray-400)}
.checkin button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-light);color:var(--accent-hover)}
.notes{list-style:none;display:grid;gap:8px;margin-top:12px}
.notes li{font-size:13px;line-height:1.45;color:var(--gray-700);padding-left:14px;position:relative}
.notes li::before{content:'';position:absolute;left:0;top:7px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat{background:var(--gray-50);border-radius:var(--r);padding:10px 12px}
.stat b{display:block;font-size:22px;font-weight:700}
.stat span{font-size:12px;color:var(--gray-500)}

/* upcoming list */
.up{display:grid;gap:2px}
.up a,.up div.r{display:flex;align-items:center;gap:12px;padding:9px 4px;border-radius:8px;color:inherit}
.up a:hover{background:var(--gray-50);text-decoration:none}
.up .d{width:44px;flex:none;font-size:12px;font-weight:700;color:var(--gray-500);text-transform:uppercase;letter-spacing:.03em}
.up .n{flex:1;min-width:0;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.up .m{font-size:12.5px;color:var(--gray-500);white-space:nowrap}

/* plan */
.phase-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.phase-head .big{font-family:var(--font-d);font-size:30px;font-weight:700;line-height:1}
.timeline{display:flex;gap:3px;margin-top:16px;align-items:stretch}
.timeline .wk{flex:1;min-width:0;height:28px;border-radius:5px;position:relative}
.timeline .wk.cur{outline:2px solid var(--accent);outline-offset:2px}
.timeline .wk.ev{background:var(--accent)!important}
.tl-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--gray-600)}
.tl-legend span{display:inline-flex;align-items:center;gap:6px}
.tl-legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.calbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.calbar .msg{flex:1;min-width:200px;font-size:13.5px;color:var(--gray-700)}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--gray-700);cursor:pointer}
.switch input{appearance:none;width:36px;height:20px;border-radius:999px;background:var(--gray-300);position:relative;transition:background .15s;cursor:pointer;flex:none}
.switch input::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .15s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{left:18px}
.week-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.week-head h3{margin:0}
.meter{height:6px;border-radius:999px;background:#E0EDFC;overflow:hidden;margin:8px 0 4px}
.meter i{display:block;height:100%;background:var(--s-fit);border-radius:999px}
.days{display:grid;gap:0;margin-top:8px}
.day{border-top:1px solid var(--gray-100)}
.day-row{width:100%;display:flex;align-items:center;gap:12px;padding:11px 4px;text-align:left;border-radius:8px}
.day-row:hover{background:var(--gray-50)}
.day.today .day-row{box-shadow:inset 3px 0 0 var(--accent);padding-left:10px}
.day .dl{width:46px;flex:none}
.day .dl b{display:block;font-size:13px;font-weight:700}
.day .dl span{font-size:11.5px;color:var(--gray-500)}
.day .nm{flex:1;min-width:0}
.day .nm b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day .nm .sub{display:flex;gap:6px;align-items:center;margin-top:3px;flex-wrap:wrap}
.day .nm .sub small{font-size:12px;color:var(--gray-500)}
.day.past .nm b{color:var(--gray-500)}
.day .mt{font-size:12.5px;color:var(--gray-500);white-space:nowrap;text-align:right}
.day .chev{width:16px;height:16px;color:var(--gray-400);flex:none;transition:transform .15s}
.day.open .chev{transform:rotate(90deg)}
.day-detail{padding:4px 4px 18px}

/* fitness */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.seg{display:inline-flex;background:var(--white);border:1px solid var(--gray-200);border-radius:var(--r);padding:3px}
.seg button{height:30px;padding:0 12px;border-radius:7px;font-size:13px;font-weight:600;color:var(--gray-600)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--white);border:1px solid var(--gray-200);border-radius:var(--r-lg);padding:14px 16px;box-shadow:var(--shadow-sm)}
.tile .k{font-size:12.5px;font-weight:600;color:var(--gray-500);display:flex;align-items:center;gap:6px}
.tile .v{font-size:30px;font-weight:700;letter-spacing:-.01em;margin-top:4px}
.tile .d{font-size:12.5px;color:var(--gray-500);margin-top:2px}
.tile .d.up{color:var(--good-text)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--gray-700);margin-bottom:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lk{width:16px;height:0;border-top:2px solid;display:inline-block}
.lk.dash{border-top-style:dashed}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.chart{position:relative;width:100%;touch-action:pan-y}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{font-family:'Inter',system-ui,sans-serif;font-size:11px;fill:var(--muted)}
.chart .lbl{fill:var(--gray-800);font-weight:600}
.tip{position:absolute;pointer-events:none;background:var(--white);border:1px solid var(--gray-200);box-shadow:var(--shadow);border-radius:10px;padding:8px 10px;font-size:12.5px;min-width:150px;z-index:5;display:none}
.tip .t{font-weight:600;color:var(--gray-600);margin-bottom:5px;font-size:12px}
.tip .l{display:flex;align-items:center;gap:8px;line-height:1.7}
.tip .l b{min-width:30px;text-align:right;font-variant-numeric:tabular-nums}
.tip .l span{color:var(--gray-500)}
details.tbl{margin-top:14px}
details.tbl summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--gray-600)}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
th,td{text-align:right;padding:6px 8px;border-bottom:1px solid var(--gray-100);font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--gray-500);font-weight:600}
.rides th:nth-child(2),.rides td.nm{text-align:left}
.rides td.nm{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rides tr.hidden td{color:var(--gray-400)}
.rides td.nm .rn{display:block;overflow:hidden;text-overflow:ellipsis}
.rides td.nm .dev{display:block;white-space:normal;font-size:11.5px;color:var(--gray-500)}
.attr{font-size:12px;color:var(--gray-600);margin:-4px 0 10px}

/* setup */
.form{display:grid;gap:16px}
.field label,.field .lab{display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px}
.field .hint{font-size:12.5px;color:var(--gray-500);margin-top:5px;line-height:1.45}
.inp{width:100%;height:42px;border:1px solid var(--gray-300);border-radius:var(--r);padding:0 12px;background:var(--white);font-size:14px}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-ring)}
.goals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.goal{border:1px solid var(--gray-200);border-radius:var(--r);padding:10px 12px;text-align:left;background:var(--white)}
.goal b{display:block;font-size:13.5px}
.goal span{display:block;font-size:12px;color:var(--gray-500);margin-top:2px;line-height:1.35}
.goal[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-light);box-shadow:0 0 0 1px var(--accent) inset}
.daypick{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.daypick button{height:40px;border-radius:var(--r);border:1px solid var(--gray-200);font-size:13px;font-weight:600;color:var(--gray-600);background:var(--white)}
.daypick button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.daypick.gymp button[aria-pressed="true"]{background:#4338CA;border-color:#4338CA}
.range-row{display:flex;align-items:center;gap:14px}
.range-row input[type=range]{flex:1;accent-color:var(--accent)}
.range-row output{font-weight:700;min-width:64px;text-align:right}
.steps-help{counter-reset:s;list-style:none;display:grid;gap:8px;font-size:13.5px;color:var(--gray-700)}
.steps-help li{counter-increment:s;padding-left:30px;position:relative;line-height:1.45}
.steps-help li::before{content:counter(s);position:absolute;left:0;top:-1px;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.ok-line{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--good-text)}
.err-line{font-size:13.5px;color:#B91C1C;font-weight:500}
.empty{text-align:center;padding:36px 18px}
.empty h2{font-family:var(--font-d);font-size:26px;letter-spacing:.02em;text-transform:none;color:var(--gray-900);margin-bottom:8px}
.empty p{color:var(--gray-600);max-width:460px;margin:0 auto 18px;line-height:1.5}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:13.5px;font-weight:500;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:100;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-lg);background:#FFFBEB;border:1px solid #FDE68A;font-size:13.5px;color:var(--gray-800);margin-bottom:16px;line-height:1.45}
.banner.err{background:#FEF2F2;border-color:#FECACA}

@media(max-width:900px){
  .hdr{height:50px;padding:0 14px;gap:10px}
  .title{font-size:17px}
  .tabs{display:none}
  .sync .lasttxt{display:none}
  main{padding:16px 16px 92px}
  .g-today,.g-2{grid-template-columns:minmax(0,1fr)}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .goals{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bnav{display:flex;position:fixed;bottom:0;left:0;right:0;height:60px;background:var(--white);border-top:1px solid var(--gray-200);z-index:60;
    padding:0 4px env(safe-area-inset-bottom);box-shadow:0 -2px 10px rgba(0,0,0,.06)}
  .bnav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--gray-400);font-size:10.5px;font-weight:500;position:relative;-webkit-tap-highlight-color:transparent}
  .bnav button svg{width:22px;height:22px}

  .hero-name{font-size:28px}

}
@media(max-width:420px){

}

<body>

  </a>

  <button role="tab" data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span>Plan</span></button>
  <button role="tab" data-tab="fitness"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-6 4 3 5-7 4 4"/><path d="M3 21h18"/></svg><span>Fitness</span></button>
  <button role="tab" data-tab="setup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg><span>Setup</span></button>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';
const E = window.CoachEngine;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS_S = 'velo-coach-settings', LS_D = 'velo-coach-data', LS_UI = 'velo-coach-ui';
const load = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (_) { return null; } };
const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} };

/* ---------------------------------------------------------------- state */
let S = Object.assign({ icuKey: '', athleteId: '', configured: false, autoPush: false, checkIn: null, updatedAt: 0 }, load(LS_S) || {});
let D = load(LS_D);             // cached intervals.icu data
let P = null;                   // built plan
const UI = Object.assign({ tab: 'today', range: '3m', open: {} }, load(LS_UI) || {});
let syncing = false, pushState = { state: 'idle', msg: '' }, apiErr = null, athleteName = (D && D.athleteName) || '';
let draft = null;               // setup form draft
const WREG = {};                // workouts by id for tooltips/downloads

const today = () => E.todayStr();
const athId = () => (S.athleteId || '').trim() || '0';
const DOW = E.DAY_NAMES, DOWL = E.DAY_LONG;
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dParts = s => { const [y,m,d] = s.split('-').map(Number); return { y, m, d }; };
const dShort = s => { const p = dParts(s); return `${p.d} ${MONTHS[p.m-1]}`; };
const dLong = s => `${DOWL[E.dow(s)]} ${dShort(s)}`;
const fmtDur = sec => E.fmtMin(Math.round(sec / 60));
const signed = v => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(Math.round(v));
const watts = (pct, ftp) => ftp ? Math.round(pct / 100 * ftp) : null;
// Garmin attribution (required by the intervals.icu API terms and Garmin's API brand guidelines)
const garminName = a => { if (!a || !a.garmin) return ''; const rest = String(a.device || '').replace(/garmin/ig, '').trim(); return rest ? 'Garmin ' + rest : 'Garmin'; };
const hasGarmin = acts => (acts || []).some(a => a && a.garmin);
const GARMIN_NOTE = 'Derived in part from Garmin device-sourced data';

function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 3200); }

/* ----------------------------------------------------- Supabase sync */
let SB = null, session = null;
try { if (window.VELO_SUPABASE && window.supabase) SB = window.supabase.createClient(VELO_SUPABASE.url, VELO_SUPABASE.key); } catch (_) {}

async function initAuth(){
  if (!SB) return;
  try {
    const { data } = await SB.auth.getSession();
    session = data && data.session;
    if (session) await pullRemote();
  } catch (_) {}
}
async function pullRemote(){
  if (!SB || !session) return false;
  try {
    const { data } = await SB.auth.getUser();
    const remote = data && data.user && data.user.user_metadata && data.user.user_metadata.velo_coach;
    if (remote && (remote.updatedAt || 0) > (S.updatedAt || 0)) {
      S = Object.assign({}, S, remote); store(LS_S, S); return true;
    }
  } catch (_) {}
  return false;
}
let pushTimer = null;
function pushRemote(){
  if (!SB || !session) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(async () => { try { await SB.auth.updateUser({ data: { velo_coach: S } }); } catch (_) {} }, 600);
}
function saveSettings(patch){
  S = Object.assign({}, S, patch, { updatedAt: Date.now() });
  store(LS_S, S); pushRemote();
}

/* ---------------------------------------------------- intervals.icu */
class ApiError extends Error { constructor(status, msg){ super(msg); this.status = status; } }
async function icu(path, { method = 'GET', query = {}, body, key } = {}){
  const qs = new URLSearchParams(Object.assign({ path }, query));
  let r;
  try {
    r = await fetch('/api/icu?' + qs.toString(), {
      method, cache: 'no-store',
      headers: Object.assign({ 'x-icu-key': key || S.icuKey }, body !== undefined ? { 'Content-Type': 'application/json' } : {}),
      body: body !== undefined ? JSON.stringify(body) : undefined
    });
  } catch (e) { throw new ApiError(0, 'You look to be offline.'); }
  const txt = await r.text();
  let j = null; try { j = txt ? JSON.parse(txt) : null; } catch (_) {}
  if (!r.ok) {
    const m = (j && (j.error || j.message)) || txt.slice(0, 160) || r.statusText;
    throw new ApiError(r.status, m);
  }
  return j;
}
function explain(e){
  if (!e) return '';
  if (e.status === 401 || e.status === 403) return 'intervals.icu didn’t accept the API key or athlete ID. Check them in Setup.';
  if (e.status === 0) return 'You look to be offline, so this is your last saved data.';
  if (e.status === 404) return 'intervals.icu couldn’t find that athlete. Leave the athlete ID blank to use your own account.';
  if (e.status === 429) return 'intervals.icu is rate-limiting requests. Try again in a minute.';
  return 'intervals.icu sync failed (' + (e.status || '?') + '): ' + e.message;
}

async function fetchFtp(){
  try { const s = await icu(`/athlete/${athId()}/sport-settings/Ride`); if (s && s.ftp) return { ftp: s.ftp, lthr: s.lthr || null }; } catch (_) {}
  try {
    const a = await icu(`/athlete/${athId()}`);
    const ss = (a && a.sportSettings || []).find(x => (x.types || []).includes('Ride'));
    if (ss && ss.ftp) return { ftp: ss.ftp, lthr: ss.lthr || null };
  } catch (_) {}
  return { ftp: null };
}

async function sync({ quiet } = {}){
  if (!S.icuKey || syncing) return;
  syncing = true; renderSync();
  const t = today();
  try {
    const id = athId();
    const [well, acts, evs, ftp] = await Promise.all([
      icu(`/athlete/${id}/wellness`, { query: { oldest: E.addDays(t, -400), newest: t } }),
      icu(`/athlete/${id}/activities`, { query: { oldest: E.addDays(t, -120), newest: E.addDays(t, 1) } }),
      icu(`/athlete/${id}/events`, { query: { oldest: E.addDays(t, -21), newest: E.addDays(t, 21) } }),
      fetchFtp()
    ]);
    D = {
      wellness: (well || []).map(w => ({ id: w.id, ctl: w.ctl, atl: w.atl })),
      activities: acts || [],
      events: (evs || []).map(e => ({ id: e.id, start_date_local: e.start_date_local, name: e.name, description: e.description, category: e.category, external_id: e.external_id })),
      ftp: ftp.ftp, athleteName: athleteName || (D && D.athleteName) || '', fetchedAt: Date.now()
    };
    store(LS_D, D); apiErr = null;
    rebuild(); renderAll();
    if (S.autoPush && P) await pushCalendar({ quiet: true });
  } catch (e) {
    apiErr = e; if (!quiet) toast(explain(e));
    renderAll();
  } finally { syncing = false; renderSync(); }
}

/* -------------------------------------------------------- the plan */
function planSettings(){ return { goal: S.goal, eventDate: S.eventDate, eventName: S.eventName, hours: S.hours, rideDays: S.rideDays, gymDays: S.gymDays, longDay: S.longDay, returning: S.returning, planStart: S.planStart, createdAt: S.createdAt }; }
function ourEvents(){ return ((D && D.events) || []).filter(E.isOurs).map(e => ({ id: e.id, date: (e.start_date_local || '').slice(0, 10), name: e.name, description: e.description })); }
function rebuild(){
  if (!S.configured || !D) { P = null; return; }
  try {
    P = E.buildPlan(planSettings(), { wellness: D.wellness, activities: D.activities, ourEvents: ourEvents(), checkIn: S.checkIn }, today());
  } catch (e) { console.error(e); P = null; }
}

/* calendar push */
function pushFrom(){
  const t = today();
  const doneToday = P && P.activities.some(a => a.date === t && (a.strava || E.isRide(a.type)));
  return doneToday ? E.addDays(t, 1) : t;
}
function pendingChanges(){
  if (!P || !D) return null;
  return E.diffCalendar(P, D.events, pushFrom());
}
async function pushCalendar({ quiet } = {}){
  if (!P || !S.icuKey) return;
  const diff = pendingChanges();
  const n = diff.create.length + diff.update.length + diff.remove.length;
  if (!n) { pushState = { state: 'ok', msg: 'Your intervals.icu calendar matches the plan.' }; renderPlan(); return; }
  pushState = { state: 'busy', msg: 'Updating your intervals.icu calendar…' }; renderPlan();
  const id = athId();
  try {
    if (diff.create.length) {
      try { await icu(`/athlete/${id}/events/bulk`, { method: 'POST', body: diff.create }); }
      catch (e) { if (e.status === 401 || e.status === 403) throw e; for (const c of diff.create) await icu(`/athlete/${id}/events`, { method: 'POST', body: c }); }
    }
    for (const u of diff.update) { const { id: eid, ...b } = u; await icu(`/athlete/${id}/events/${eid}`, { method: 'PUT', body: b }); }
    for (const r of diff.remove) await icu(`/athlete/${id}/events/${r}`, { method: 'DELETE' });
    const t = today();
    const evs = await icu(`/athlete/${id}/events`, { query: { oldest: E.addDays(t, -21), newest: E.addDays(t, 21) } });
    D.events = (evs || []).map(e => ({ id: e.id, start_date_local: e.start_date_local, name: e.name, description: e.description, category: e.category, external_id: e.external_id }));
    store(LS_D, D);
    const parts = [];
    if (diff.create.length) parts.push(`${diff.create.length} added`);
    if (diff.update.length) parts.push(`${diff.update.length} updated`);
    if (diff.remove.length) parts.push(`${diff.remove.length} removed`);
    pushState = { state: 'ok', msg: `Calendar updated: ${parts.join(', ')}.` };
    if (!S.autoPush) saveSettings({ autoPush: true });
    if (!quiet) toast('intervals.icu calendar updated');
  } catch (e) {
    pushState = { state: 'err', msg: explain(e) };
    if (!quiet) toast('Couldn’t update intervals.icu');
  }
  rebuild(); renderAll();
}
async function removeOurWorkouts(){
  const id = athId(), t = today();
  const ours = (D.events || []).filter(e => E.isOurs(e) && (e.start_date_local || '').slice(0, 10) >= t);
  for (const e of ours) await icu(`/athlete/${id}/events/${e.id}`, { method: 'DELETE' });
  D.events = (D.events || []).filter(e => !ours.includes(e)); store(LS_D, D);
  saveSettings({ autoPush: false });
  pushState = { state: 'idle', msg: '' };
  toast(`Removed ${ours.length} VÉLO workout${ours.length === 1 ? '' : 's'} from intervals.icu`);
  rebuild(); renderAll();
}

/* ---------------------------------------------------------- charts */
const ZC = ['#86b6ef', '#6da7ec', '#5598e7', '#3987e5', '#256abf', '#184f95', '#0d366b'];
const zoneCol = p => ZC[E.zoneOf(p) - 1];
let wseq = 0;
function reg(w){ const id = 'w' + (++wseq); WREG[id] = w; return id; }

function profileSvg(w, { mini = false, h = 96 } = {}){
  const flat = E.flatten(w), T = w.seconds || 1;
  const maxP = Math.max(125, ...flat.map(s => Math.max(s.lo, s.hi)) ) + 5;
  const y = p => (h - (p / maxP) * (h - (mini ? 1 : 4))).toFixed(2);
  let g = '';
  for (const s of flat) {
    const x0 = (s.t0 / T * 1000).toFixed(2), x1 = ((s.t0 + s.d) / T * 1000).toFixed(2);
    if (s.ramp) g += `<polygon points="${x0},${h} ${x0},${y(s.lo)} ${x1},${y(s.hi)} ${x1},${h}" fill="${zoneCol((s.lo + s.hi) / 2)}" stroke="#fff" stroke-width="${mini ? .5 : 1}" vector-effect="non-scaling-stroke"/>`;
    else g += `<rect x="${x0}" y="${y(s.mid)}" width="${(x1 - x0).toFixed(2)}" height="${(h - y(s.mid)).toFixed(2)}" fill="${zoneCol(s.mid)}" stroke="#fff" stroke-width="${mini ? .5 : 1}" vector-effect="non-scaling-stroke"/>`;
  }
  if (mini) return `<svg class="prof-mini" viewBox="0 0 1000 ${h}" preserveAspectRatio="none" aria-hidden="true">${g}</svg>`;
  const yF = y(100);
  const id = reg(w);
  return `<div class="prof-wrap" data-wid="${id}">
    <svg class="prof" viewBox="0 0 1000 ${h}" preserveAspectRatio="none" role="img" aria-label="Workout profile: ${esc(w.name)}">
      <line x1="0" x2="1000" y1="${yF}" y2="${yF}" stroke="#94A3B8" stroke-width="1" vector-effect="non-scaling-stroke"/>${g}</svg>
    <span class="ftp-tag" style="top:${(yF / h * 96).toFixed(1)}px">FTP</span>
    <div class="tip"></div>
    <div class="prof-axis"><span>0</span><span>${fmtDur(T / 2)}</span><span>${fmtDur(T)}</span></div>
  </div>`;
}

function bindProfileTips(root){
  root.querySelectorAll('.prof-wrap').forEach(wrap => {
    const w = WREG[wrap.dataset.wid]; if (!w) return;
    const svg = wrap.querySelector('svg'), tip = wrap.querySelector('.tip');
    const flat = E.flatten(w), ftp = D && D.ftp;
    const show = ev => {
      const r = svg.getBoundingClientRect();
      const x = Math.min(Math.max(ev.clientX - r.left, 0), r.width);
      const t = x / r.width * w.seconds;
      const s = flat.find(q => t >= q.t0 && t < q.t0 + q.d) || flat[flat.length - 1];
      const pct = s.ramp ? `${s.lo}→${s.hi}%` : (s.lo === s.hi ? `${s.lo}%` : `${s.lo}–${s.hi}%`);
      const wt = ftp ? (s.lo === s.hi ? `${watts(s.lo, ftp)} W` : `${watts(s.lo, ftp)}–${watts(s.hi, ftp)} W`) : '';
      tip.innerHTML = '';
      const head = document.createElement('div'); head.className = 't'; head.textContent = `${E.durText(s.d)} · starts ${fmtDur(s.t0)}`; tip.appendChild(head);
      const l = document.createElement('div'); l.className = 'l';
      const b = document.createElement('b'); b.textContent = wt || pct; l.appendChild(b);
      const sp = document.createElement('span'); sp.textContent = wt ? `${pct} FTP` : 'of FTP'; l.appendChild(sp);
      tip.appendChild(l);
      if (s.cad) { const c = document.createElement('div'); c.className = 'l'; const cs = document.createElement('span'); cs.textContent = s.cad; c.appendChild(cs); tip.appendChild(c); }
      tip.style.display = 'block';
      const tw = tip.offsetWidth;
      tip.style.left = Math.min(Math.max(x - tw / 2, 0), r.width - tw) + 'px';
      tip.style.top = '-8px'; tip.style.transform = 'translateY(-100%)';
    };
    svg.addEventListener('pointermove', show);
    svg.addEventListener('pointerdown', show);
    svg.addEventListener('pointerleave', () => { tip.style.display = 'none'; });
  });
}

function niceTicks(min, max, n = 4){
  const span = max - min || 1;
  const step0 = span / n, mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => span / s <= n) || 10 * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
  const out = []; for (let v = lo; v <= hi + 1e-9; v += step) out.push(Math.round(v * 100) / 100);
  return out;
}

const RANGES = { '6w': 42, '3m': 91, '6m': 182, '1y': 365 };
let pmcState = null;
function renderPmc(){
  const host = $('pmc'); if (!host || !P) return;
  const W = host.clientWidth; if (!W) return;
  const days = RANGES[UI.range] || 91;
  const from = E.addDays(P.today, -days);
  const pts = P.pmc.filter(p => p.date >= from);
  const n = pts.length; if (n < 2) return;
  const narrow = W < 520;
  const m = { l: 34, r: narrow ? 34 : 44, t: 18, b: 24 };
  const H1 = narrow ? 190 : 230, H2 = narrow ? 140 : 160;
  const iw = W - m.l - m.r;
  const x = i => m.l + i * iw / (n - 1);
  const ti = pts.findIndex(p => p.date === P.today);

  // chart 1: fitness + fatigue
  const maxY = Math.max(10, ...pts.map(p => Math.max(p.ctl, p.atl))) * 1.08;
  const t1 = niceTicks(0, maxY, 4); const y1max = t1[t1.length - 1];
  const y1 = v => m.t + (1 - v / y1max) * (H1 - m.t - m.b);
  // chart 2: form
  const FL = E.FORM_FLOOR;
  const minF = Math.min(...pts.map(p => p.tsb), ...pts.map(p => -0.35 * Math.max(p.ctl, FL)));
  const maxF = Math.max(...pts.map(p => p.tsb), ...pts.map(p => 0.3 * Math.max(p.ctl, FL)));
  const t2 = niceTicks(minF, maxF, 4); const y2min = t2[0], y2max = t2[t2.length - 1];
  const y2 = v => m.t + (1 - (v - y2min) / (y2max - y2min)) * (H2 - m.t - m.b);

  const path = (acc, yf, a, b) => { let d = ''; for (let i = a; i <= b; i++) d += (i === a ? 'M' : 'L') + x(i).toFixed(1) + ',' + yf(acc(pts[i])).toFixed(1); return d; };
  const split = ti >= 0 ? ti : n - 1;
  const lineSet = (acc, yf, col) => `<path d="${path(acc, yf, 0, split)}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>` +
    (split < n - 1 ? `<path d="${path(acc, yf, split, n - 1)}" fill="none" stroke="${col}" stroke-width="2" stroke-dasharray="4 4" stroke-linecap="round"/>` : '');

  // x ticks
  const xt = [];
  if (days <= 50) { for (let i = 0; i < n; i++) if (E.dow(pts[i].date) === 0 && (n - i) > 3) xt.push(i); }
  else { for (let i = 0; i < n; i++) if (dParts(pts[i].date).d === 1) xt.push(i); }
  const xtick = (H) => xt.map(i => `<text x="${x(i).toFixed(1)}" y="${H - 6}" text-anchor="middle">${days <= 50 ? dShort(pts[i].date) : MONTHS[dParts(pts[i].date).m - 1]}</text>`).join('');
  const grid = (ticks, yf, H) => ticks.map(v => `<line x1="${m.l}" x2="${W - m.r}" y1="${yf(v).toFixed(1)}" y2="${yf(v).toFixed(1)}" stroke="${v === 0 ? '#CBD5E1' : '#EEF0F3'}" stroke-width="1"/><text x="${m.l - 6}" y="${(yf(v) + 4).toFixed(1)}" text-anchor="end">${v}</text>`).join('');
  const todayMark = (H, yTop) => ti >= 0 ? `<rect x="${x(ti).toFixed(1)}" y="${yTop}" width="${(W - m.r - x(ti)).toFixed(1)}" height="${H - m.b - yTop}" fill="#F8FAFC"/><line x1="${x(ti).toFixed(1)}" x2="${x(ti).toFixed(1)}" y1="${yTop}" y2="${H - m.b}" stroke="#CBD5E1" stroke-width="1"/>` : '';
  const todayLbl = ti >= 0 && ti < n - 1 ? `<text x="${(x(ti) + 4).toFixed(1)}" y="${m.t - 6}">Today → plan</text>` : '';

  // end labels (value only; legend names the series)
  const last = pts[n - 1];
  let ly1 = y1(last.ctl), ly2 = y1(last.atl);
  if (Math.abs(ly1 - ly2) < 13) { const mid = (ly1 + ly2) / 2; if (ly1 < ly2) { ly1 = mid - 7; ly2 = mid + 7; } else { ly1 = mid + 7; ly2 = mid - 7; } }
  const endLbls = `<circle cx="${x(n - 1).toFixed(1)}" cy="${y1(last.ctl).toFixed(1)}" r="4" fill="var(--s-fit)" stroke="#fff" stroke-width="2"/><circle cx="${x(n - 1).toFixed(1)}" cy="${y1(last.atl).toFixed(1)}" r="4" fill="var(--s-fat)" stroke="#fff" stroke-width="2"/>
    <text class="lbl" x="${(x(n - 1) + 8).toFixed(1)}" y="${(ly1 + 4).toFixed(1)}">${Math.round(last.ctl)}</text><text class="lbl" x="${(x(n - 1) + 8).toFixed(1)}" y="${(ly2 + 4).toFixed(1)}">${Math.round(last.atl)}</text>`;

  const svg1 = `<svg viewBox="0 0 ${W} ${H1}" height="${H1}" role="img" aria-label="Fitness and fatigue over time">${todayMark(H1, m.t)}${grid(t1, y1, H1)}${xtick(H1)}
    ${lineSet(p => p.atl, y1, 'var(--s-fat)')}${lineSet(p => p.ctl, y1, 'var(--s-fit)')}${endLbls}${todayLbl}
    <line class="xh" x1="0" x2="0" y1="${m.t}" y2="${H1 - m.b}" stroke="#334155" stroke-width="1" style="display:none"/></svg>`;

  // form bands (zones scale with fitness, so they follow it day by day)
  const zoneFill = { risk: 'rgba(208,59,59,.11)', optimal: 'rgba(12,163,12,.10)', grey: 'rgba(100,116,139,.06)', fresh: 'rgba(42,120,214,.09)', transition: 'rgba(250,178,25,.14)' };
  const clampY = v => Math.max(y2min, Math.min(y2max, v));
  let bands = '', bandLbls = '';
  for (const z of E.FORM_ZONES) {
    const top = pts.map((p, i) => `${x(i).toFixed(1)},${y2(clampY(z.max * Math.max(p.ctl, FL))).toFixed(1)}`);
    const bot = pts.map((p, i) => `${x(i).toFixed(1)},${y2(clampY(z.min * Math.max(p.ctl, FL))).toFixed(1)}`).reverse();
    bands += `<polygon points="${top.concat(bot).join(' ')}" fill="${zoneFill[z.id]}"/>`;
  }
  const svg2 = `<svg viewBox="0 0 ${W} ${H2}" height="${H2}" role="img" aria-label="Form over time with training zones">${bands}${grid(t2, y2, H2)}${xtick(H2)}
    ${ti >= 0 ? `<line x1="${x(ti).toFixed(1)}" x2="${x(ti).toFixed(1)}" y1="${m.t}" y2="${H2 - m.b}" stroke="#CBD5E1" stroke-width="1"/>` : ''}
    ${lineSet(p => p.tsb, y2, 'var(--ink-2)')}
    <circle cx="${x(n - 1).toFixed(1)}" cy="${y2(last.tsb).toFixed(1)}" r="4" fill="var(--ink-2)" stroke="#fff" stroke-width="2"/>
    <text class="lbl" x="${(x(n - 1) + 8).toFixed(1)}" y="${(y2(last.tsb) + 4).toFixed(1)}">${signed(last.tsb)}</text>
    <line class="xh" x1="0" x2="0" y1="${m.t}" y2="${H2 - m.b}" stroke="#334155" stroke-width="1" style="display:none"/></svg>`;

  host.innerHTML = `
    <div class="legend"><span><i class="lk" style="border-color:var(--s-fit)"></i>Fitness (CTL)</span><span><i class="lk" style="border-color:var(--s-fat)"></i>Fatigue (ATL)</span><span><i class="lk dash" style="border-color:var(--gray-500)"></i>Planned</span></div>
    <div class="chart" id="c1" tabindex="0" aria-label="Fitness chart. Use arrow keys to read values.">${svg1}<div class="tip"></div></div>
    <div class="legend" style="margin-top:14px"><span><i class="lk" style="border-color:var(--ink-2)"></i>Form (TSB)</span>
      ${E.FORM_ZONES.slice().reverse().map(z => `<span><i class="sw" style="background:${zoneFill[z.id].replace(/[\d.]+\)$/, '.35)')}"></i>${esc(z.label)}</span>`).join('')}</div>
    <div class="chart" id="c2" tabindex="0" aria-label="Form chart. Use arrow keys to read values.">${svg2}<div class="tip"></div></div>`;
  void bandLbls;
  pmcState = { pts, x, n, m, W, iw };
  bindCrosshair();
}

function bindCrosshair(){
  const charts = [$('c1'), $('c2')]; if (!charts[0]) return;
  const { pts, x, n, m, iw } = pmcState;
  let idx = null;
  const draw = (i, src) => {
    idx = i;
    charts.forEach(c => { const l = c.querySelector('.xh'); l.setAttribute('x1', x(i)); l.setAttribute('x2', x(i)); l.style.display = ''; c.querySelector('.tip').style.display = 'none'; });
    const p = pts[i], z = E.formZone(p.ctl, p.tsb);
    const tip = src.querySelector('.tip');
    tip.innerHTML = '';
    const add = (val, label, col, dash) => {
      const l = document.createElement('div'); l.className = 'l';
      if (col) { const k = document.createElement('i'); k.className = 'lk' + (dash ? ' dash' : ''); k.style.borderColor = col; l.appendChild(k); }
      const b = document.createElement('b'); b.textContent = val; l.appendChild(b);
      const s = document.createElement('span'); s.textContent = label; l.appendChild(s);
      tip.appendChild(l);
    };
    const h = document.createElement('div'); h.className = 't'; h.textContent = dLong(p.date) + (p.projected ? ' · planned' : ''); tip.appendChild(h);
    add(Math.round(p.ctl), 'Fitness', 'var(--s-fit)', p.projected);
    add(Math.round(p.atl), 'Fatigue', 'var(--s-fat)', p.projected);
    add(signed(p.tsb), 'Form · ' + z.label, 'var(--ink-2)', p.projected);
    add(Math.round(p.load), p.projected ? 'Planned load' : 'Load that day');
    tip.style.display = 'block';
    const tw = tip.offsetWidth, cw = src.clientWidth;
    let left = x(i) + 12; if (left + tw > cw) left = x(i) - tw - 12;
    tip.style.left = Math.max(0, left) + 'px'; tip.style.top = (m.t) + 'px';
  };
  const hide = () => charts.forEach(c => { c.querySelector('.xh').style.display = 'none'; c.querySelector('.tip').style.display = 'none'; });
  charts.forEach(c => {
    const at = ev => { const r = c.getBoundingClientRect(); const i = Math.round((ev.clientX - r.left - m.l) / iw * (n - 1)); return Math.max(0, Math.min(n - 1, i)); };
    c.addEventListener('pointermove', ev => draw(at(ev), c));
    c.addEventListener('pointerdown', ev => draw(at(ev), c));
    c.addEventListener('pointerleave', hide);
    c.addEventListener('keydown', ev => {
      if (ev.key === 'ArrowLeft' || ev.key === 'ArrowRight') { ev.preventDefault(); const i = idx == null ? n - 1 : idx + (ev.key === 'ArrowRight' ? 1 : -1); draw(Math.max(0, Math.min(n - 1, i)), c); }
      if (ev.key === 'Escape') hide();
    });
    c.addEventListener('blur', hide);
  });
}

/* ----------------------------------------------------- render: shared */
function workoutSteps(w){
  const ftp = D && D.ftp;
  return `<div class="steps">${w.blocks.map(b => `<div>
    ${b.title || (b.reps || 1) > 1 ? `<h4>${esc(b.title || 'Repeat')}${(b.reps || 1) > 1 ? ` × ${b.reps}` : ''}</h4>` : ''}
    <ul>${b.steps.map(s => {
      const pct = s.ramp ? `${s.lo}→${s.hi}%` : (s.lo === s.hi ? `${s.lo}%` : `${s.lo}–${s.hi}%`);
      const wt = ftp ? (s.ramp ? `${watts(s.lo, ftp)}→${watts(s.hi, ftp)} W` : s.lo === s.hi ? `${watts(s.lo, ftp)} W` : `${watts(s.lo, ftp)}–${watts(s.hi, ftp)} W`) : '';
      return `<li><span class="num">${E.durText(s.d)}</span><span><span class="w">${wt || pct}</span>${wt ? ` <span class="c">${pct}</span>` : ''}</span><span class="c">${esc(s.cad || '')}</span></li>`;
    }).join('')}</ul></div>`).join('')}</div>`;
}
function workoutActions(w, date){
  const id = reg(w);
  return `<div class="actions">
    <button class="btn" data-act="zwo" data-wid="${id}" data-date="${date || ''}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>Zwift file (.zwo)</button>
    <button class="btn btn-ghost" data-act="copy" data-wid="${id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 012-2h10"/></svg>Copy workout text</button>
  </div>`;
}
function workoutDetail(w, date){
  return `${w.note ? `<div class="note">${esc(w.note)}</div>` : ''}
    <p class="why" style="margin-top:${w.note ? 10 : 0}px">${esc(w.why)}</p>
    ${profileSvg(w)}${workoutSteps(w)}${workoutActions(w, date)}`;
}
function metaLine(w){
  const ftp = D && D.ftp;
  const np = ftp ? Math.round(w.if * ftp) : null;
  return `${fmtDur(w.seconds)} · load ${w.tss}${np ? ` · ~${np} W weighted` : ''}`;
}
function doneSummary(acts){
  return acts.map(a => a.strava ? 'Activity (via Strava — details hidden)' : `${esc(a.name)} · ${fmtDur(a.seconds)} · load ${Math.round(a.load)}${a.garmin ? ' · ' + esc(garminName(a)) : ''}`).join('<br>');
}
function statusIcon(z){
  const map = { critical: ['var(--critical)', '!'], good: ['var(--good)', '✓'], neutral: ['var(--gray-400)', '–'], info: ['var(--s-fit)', '↑'], warning: ['var(--warn)', '↓'] };
  const [c, g] = map[z.status] || map.neutral;
  return `<span class="status"><span class="ico" style="background:${c};${z.status === 'warning' ? 'color:#0b0b0b' : ''}">${g}</span>${esc(z.label)}</span>`;
}

function renderToday(){

/* ------------------------------------------------------- render: plan */
const PH_COL = { reentry: '#b7d3f6', base: '#86b6ef', build: '#3987e5', peak: '#1c5cab', taper: '#9ec5f4', event: 'var(--accent)' };
function renderPlan(){
  const v = $('v-plan');
  if (!S.icuKey || !S.configured || !P) { v.innerHTML = `<div class="card empty"><h2>No plan yet</h2><p>Set your goal and the days you can ride, and your plan appears here.</p><button class="btn btn-primary" data-go="setup">Set up your plan</button></div>`; return; }
  const s = P.settings, wk = P.currentWeek;
  const goalTxt = { fitness: 'General fitness', ftp: 'Raise FTP', climbing: 'Climbing', event: s.eventName || 'Event' }[s.goal] || 'Fitness';
  const sched = P.schedule.slice(0, s.eventDate ? P.schedule.length : 20);
  const curIdx = wk ? wk.index : -1;
  const phasesShown = [...new Set(sched.map(w => w.phase))];

  const diff = pendingChanges();
  const nChanges = diff ? diff.create.length + diff.update.length + diff.remove.length : 0;
  let calMsg, calBtn;
  if (pushState.state === 'busy') { calMsg = pushState.msg; calBtn = `<button class="btn" disabled>Updating…</button>`; }
  else if (pushState.state === 'err') { calMsg = `<span class="err-line">${esc(pushState.msg)}</span>`; calBtn = `<button class="btn btn-primary" data-act="push">Try again</button>`; }
  else if (!nChanges) { calMsg = `<span class="ok-line">✓ Your intervals.icu calendar matches the plan.</span>`; calBtn = ''; }
  else if (!S.autoPush) { calMsg = `Send the next two weeks to your intervals.icu calendar. Intervals.icu can then pass them to Garmin, Wahoo or Zwift if you’ve linked those. After that, the calendar updates itself whenever the plan changes.`; calBtn = `<button class="btn btn-primary" data-act="push">Send to intervals.icu</button>`; }
  else { calMsg = `${nChanges} change${nChanges === 1 ? '' : 's'} to send to intervals.icu.`; calBtn = `<button class="btn btn-primary" data-act="push">Update now</button>`; }

  const weekCard = (w, title) => {
    if (!w.days) return '';
    const pct = w.targetTss ? Math.min(100, Math.round(w.plannedTss / w.targetTss * 100)) : 0;
    const limited = w.targetTss && w.plannedTss < w.targetTss * 0.9 && w.budgetMin && w.plannedMin >= w.budgetMin * 0.85;
    return `<div class="card">
      <div class="week-head"><h3>${title}</h3><span class="muted small">${dShort(w.start)} – ${dShort(E.addDays(w.start, 6))}</span><span class="spacer"></span><span class="chip">${esc(w.label || '')}</span></div>
      ${hasGarmin(w.days.flatMap(d => d.done || [])) ? `<div class="attr">Completed rides include Garmin device-sourced data</div>` : ''}
      ${w.phase === 'pending' || w.phase === 'done' ? '' : `<div class="small muted num">Planned ${E.fmtMin(w.plannedMin)} · load ${w.plannedTss} of ${w.targetTss} target${w.doneTss ? ` · done so far ${w.doneTss}` : ''}</div>
      <div class="meter" role="img" aria-label="Planned load ${w.plannedTss} of ${w.targetTss}"><i style="width:${pct}%"></i></div>
      ${limited ? `<div class="xs muted">Your weekly hours cap the load here. That’s fine: fitness just builds a bit slower.</div>` : ''}`}
      <div class="days">${w.days.map(d => dayRow(d)).join('')}</div>
    </div>`;
  };

  v.innerHTML = `<div class="stack">
    <div class="card">
      <div class="phase-head">
        <div><div class="eyebrow">${esc(goalTxt)}${s.eventDate ? ` · ${esc(dLong(s.eventDate))}` : ''}</div>
          <div class="big">${wk ? `Week ${wk.index + 1} · ${esc(wk.label)}` : (P.weeks[0].phase === 'pending' ? 'Starts ' + esc(dShort(s.planStart)) : 'Plan complete')}</div></div>
        <span class="spacer"></span>
        ${P.eventCountdown != null && P.eventCountdown >= 0 ? `<div style="text-align:right"><div class="big num">${P.eventCountdown}</div><div class="eyebrow">days to go</div></div>` : ''}
      </div>
      <div class="timeline" role="img" aria-label="Plan phases by week">${sched.map(w => `<div class="wk${w.index === curIdx ? ' cur' : ''}${w.phase === 'event' ? ' ev' : ''}" style="background:${w.isRecovery ? '#E5E7EB' : PH_COL[w.phase]}" title="Week ${w.index + 1} · ${esc(w.label)} · ${esc(dShort(w.start))}"></div>`).join('')}</div>
      <div class="tl-legend">${phasesShown.map(p => `<span><i style="background:${PH_COL[p]}"></i>${E.PHASE_LABEL[p]}</span>`).join('')}<span><i style="background:#E5E7EB"></i>Recovery week</span></div>
    </div>
    <div class="card"><div class="calbar"><div class="msg">${calMsg}</div>${calBtn}
      <label class="switch"><input type="checkbox" id="autoPush" ${S.autoPush ? 'checked' : ''}>Keep it updated</label></div></div>
    <div class="grid g-2">${weekCard(P.weeks[0], 'This week')}${weekCard(P.weeks[1], 'Next week')}</div>
  </div>`;
  bindProfileTips(v);
}
function dayRow(d){
  const t = P.today, open = !!UI.open[d.date];
  const rides = (d.done || []).filter(a => a.strava || E.isRide(a.type));
  const w = d.workout;
  let name, sub = [], meta = '';
  if (d.slot === 'event') { name = '🏁 ' + (d.note || 'Event'); }
  else if (w) { name = w.name; meta = `${fmtDur(w.seconds)} · ${w.tss}`; }
  else if (d.slot === 'pre') name = '—';
  else name = d.gym ? 'Gym' : 'Rest';
  if (w && w.key) sub.push(`<span class="chip key">Key</span>`);
  if (d.gym && w) sub.push(`<span class="chip gym">+ Gym</span>`);
  else if (d.gym && !w) {}
  if (rides.length) sub.push(`<span class="chip done"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>Done${rides[0].strava ? '' : ' · ' + Math.round(rides.reduce((a, r) => a + r.load, 0))}</span>`);
  else if (d.missed) sub.push(`<span class="chip miss">Missed</span>`);
  if (d.note && !(d.slot === 'event')) sub.push(`<small>${esc(d.note)}</small>`);
  if (!w && rides.length) sub.push(`<small>${esc(rides[0].strava ? 'Activity' : rides[0].name)}</small>`);
  const cls = ['day', d.date === t ? 'today' : '', d.date < t ? 'past' : '', open ? 'open' : ''].join(' ');
  const canOpen = !!w;
  return `<div class="${cls}" id="day-${d.date}">
    <button class="day-row" ${canOpen ? `data-toggle="${d.date}" aria-expanded="${open}"` : 'disabled style="cursor:default"'}>
      <span class="dl"><b>${DOW[d.dow]}</b><span>${dParts(d.date).d} ${MONTHS[dParts(d.date).m - 1]}</span></span>
      ${w ? profileSvg(w, { mini: true, h: 24 }) : '<span class="prof-mini"></span>'}
      <span class="nm"><b>${esc(name)}</b>${sub.length ? `<span class="sub">${sub.join('')}</span>` : ''}</span>
      <span class="mt num">${meta}</span>
      ${canOpen ? '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>' : '<span style="width:16px"></span>'}
    </button>
    ${open && w ? `<div class="day-detail">${workoutDetail(w, d.date)}</div>` : ''}
  </div>`;
}

      <details class="tbl"><summary>Show as a table</summary>
        <table><thead><tr><th>Week ending</th><th>Fitness</th><th>Fatigue</th><th>Form</th><th>Load (7d)</th></tr></thead>
        <tbody>${weekly.map(w => `<tr><td>${esc(dShort(w.date))}${w.projected ? ' (plan)' : ''}</td><td>${Math.round(w.ctl)}</td><td>${Math.round(w.atl)}</td><td>${signed(w.tsb)}</td><td>${Math.round(w.load)}</td></tr>`).join('')}</tbody></table>
      </details>
      <p class="xs muted" style="margin-top:12px;line-height:1.5">Fitness is your 6-week training load average, fatigue is the last week’s. Form is fitness minus fatigue. The shaded bands scale with your fitness. The dashed section projects the plan two weeks ahead (bike sessions only).</p>
    </div>

      ${rides.length ? `<div style="overflow-x:auto"><table class="rides"><thead><tr><th>Date</th><th>Ride</th><th>Time</th><th>Load</th><th>Wtd power</th><th>Intensity</th></tr></thead><tbody>
      ${rides.map(a => `<tr class="${a.strava ? 'hidden' : ''}"><td>${esc(dShort(a.date))}</td><td class="nm"><span class="rn">${esc(a.strava ? 'Via Strava (details hidden)' : a.name)}</span>${a.garmin ? `<small class="dev">${esc(garminName(a))}</small>` : ''}</td><td>${a.seconds ? fmtDur(a.seconds) : '–'}</td><td>${a.load ? Math.round(a.load) : '–'}</td><td>${a.np ? Math.round(a.np) + ' W' : '–'}</td><td>${a.intensity ? a.intensity.toFixed(2) : '–'}</td></tr>`).join('')}

function go(tab, { scrollTo } = {}){

  if (location.hash !== '#' + tab) history.replaceState(null, '', '#' + tab);

/* -------------------------------------------------------------- events */
function download(name, text, type){
  const blob = new Blob([text], { type });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
document.addEventListener('click', async ev => {
  const tabBtn = ev.target.closest('[data-tab]'); if (tabBtn) { go(tabBtn.dataset.tab); return; }
  const goBtn = ev.target.closest('[data-go]'); if (goBtn) { go(goBtn.dataset.go); return; }
  const openA = ev.target.closest('[data-open]');
  if (openA) { ev.preventDefault(); UI.open = { [openA.dataset.open]: true }; renderPlan(); go('plan', { scrollTo: openA.dataset.open }); return; }
  const tog = ev.target.closest('[data-toggle]');
  if (tog) { const d = tog.dataset.toggle; UI.open[d] = !UI.open[d]; renderPlan(); const el = document.getElementById('day-' + d); if (el && UI.open[d]) el.scrollIntoView({ block: 'nearest' }); return; }
  const ci = ev.target.closest('[data-ci]');
  if (ci) {
    const val = ci.dataset.ci, cur = S.checkIn && S.checkIn.date === today() ? S.checkIn.value : null;
    saveSettings({ checkIn: cur === val ? null : { date: today(), value: val } });
    rebuild(); renderAll();
    if (S.autoPush) pushCalendar({ quiet: true });
    return;
  }
  const rng = ev.target.closest('[data-range]'); if (rng) { UI.range = rng.dataset.range; store(LS_UI, UI); renderFitness(); return; }
  const gl = ev.target.closest('[data-goal]'); if (gl) { readDraftInputs(); draft.goal = gl.dataset.goal; renderSetup(); return; }
  const st = ev.target.closest('[data-start]'); if (st) { readDraftInputs(); draft.startWhen = st.dataset.start; renderSetup(); return; }
  const rd = ev.target.closest('[data-ride]');
  if (rd) { readDraftInputs(); const i = +rd.dataset.ride; draft.rideDays = draft.rideDays.includes(i) ? draft.rideDays.filter(x => x !== i) : draft.rideDays.concat(i).sort(); if (!draft.rideDays.includes(+draft.longDay)) draft.longDay = draft.rideDays.includes(6) ? 6 : draft.rideDays.includes(5) ? 5 : draft.rideDays[draft.rideDays.length - 1]; renderSetup(); return; }
  const gd = ev.target.closest('[data-gym]');
  if (gd) { readDraftInputs(); const i = +gd.dataset.gym; draft.gymDays = draft.gymDays.includes(i) ? draft.gymDays.filter(x => x !== i) : draft.gymDays.concat(i).sort(); renderSetup(); return; }

  const act = ev.target.closest('[data-act]'); if (!act) return;
  const a = act.dataset.act;
  if (a === 'zwo') { const w = WREG[act.dataset.wid]; if (w) download(`${(act.dataset.date || 'velo')}-${w.name.replace(/[^\w]+/g, '-').replace(/-+$/, '')}.zwo`, E.toZwo(w), 'application/xml'); return; }
  if (a === 'copy') { const w = WREG[act.dataset.wid]; if (w) { try { await navigator.clipboard.writeText(E.toIcuText(w)); toast('Workout text copied. Paste it into the intervals.icu workout builder.'); } catch (_) { toast('Couldn’t copy on this device'); } } return; }
  if (a === 'push') { pushCalendar(); return; }
  if (a === 'test') {
    readDraftInputs();
    if (!draft.icuKey) { draft.connMsg = '<span class="err-line">Paste your API key first.</span>'; renderSetup(); return; }
    draft.connMsg = '<span class="muted small">Checking…</span>'; renderSetup();
    try {
      const ath = await icu(`/athlete/${draft.athleteId || '0'}`, { key: draft.icuKey });
      athleteName = (ath && (ath.name || ath.firstname)) || '';
      draft.connMsg = `<span class="ok-line">✓ Connected${athleteName ? ' as ' + esc(athleteName) : ''}</span>`;
    } catch (e) { draft.connMsg = `<span class="err-line">${esc(explain(e))}</span>`; }
    renderSetup(); return;
  }
  if (a === 'save' || a === 'restart') {
    readDraftInputs();
    const f = draft, msg = $('saveMsg');
    if (!f.icuKey) { msg.textContent = 'Add your intervals.icu API key first.'; return; }
    if (!f.rideDays.length) { msg.textContent = 'Pick at least one day you can ride.'; return; }
    if (f.goal === 'event' && (!f.eventDate || f.eventDate <= today())) { msg.textContent = 'Pick an event date in the future.'; return; }
    const t = today();
    const thisMon = E.mondayOf(t), nextMon = E.addDays(thisMon, 7);
    const startMon = (a !== 'restart' && f.startWhen === 'next') ? nextMon : thisMon;
    const keyChanged = f.icuKey !== S.icuKey || f.athleteId !== S.athleteId;
    let restart = a === 'restart' || !S.configured || !S.planStart;
    if (!restart && f.startWhen === 'next' && S.planStart !== nextMon && S.planStart <= thisMon) restart = true;   // push start back a week
    if (!restart && f.startWhen === 'this' && S.planStart > thisMon) restart = true;                               // bring a future start forward
    if (a === 'restart') f.startWhen = 'this';
    const patch = { icuKey: f.icuKey, athleteId: f.athleteId, goal: f.goal, eventDate: f.goal === 'event' ? f.eventDate : '', eventName: f.goal === 'event' ? f.eventName : '',
      hours: f.hours, rideDays: f.rideDays, gymDays: f.gymDays, longDay: +f.longDay, returning: f.returning, configured: true };
    if (restart) { patch.planStart = startMon; patch.createdAt = startMon > t ? startMon : t; }
    saveSettings(patch);
    if (keyChanged) { D = null; store(LS_D, null); apiErr = null; }
    draft = null;
    rebuild(); go('plan'); renderAll();
    toast(restart ? 'Plan built' : 'Plan updated');
    await sync();
    return;
  }
  if (a === 'ftp') {
    readDraftInputs();
    const v = Math.round(+draft.ftpEdit);
    if (!(v >= 80 && v <= 600)) { toast('Enter an FTP between 80 and 600 W'); return; }
    try { await icu(`/athlete/${athId()}/sport-settings/Ride`, { method: 'PUT', body: { ftp: v } }); D = Object.assign({}, D || {}, { ftp: v }); store(LS_D, D); draft.ftpEdit = ''; toast(`FTP set to ${v} W in intervals.icu`); renderAll(); }
    catch (e) { toast(explain(e)); }
    return;
  }
  if (a === 'unpush') {
    if (act.dataset.armed !== '1') { act.dataset.armed = '1'; act.textContent = 'Tap again to remove them'; setTimeout(() => { if (act.isConnected) { act.dataset.armed = ''; act.textContent = 'Remove VÉLO workouts from intervals.icu'; } }, 4000); return; }
    try { await removeOurWorkouts(); } catch (e) { toast(explain(e)); }
    return;
  }
  if (a === 'signin') {
    const em = $('aEmail').value.trim(), pw = $('aPass').value, m = $('aMsg');
    m.textContent = '';
    try {
      const { data, error } = await SB.auth.signInWithPassword({ email: em, password: pw });
      if (error) throw error;
      session = data.session;
      const pulled = await pullRemote();
      if (!pulled && S.configured) pushRemote();
      draft = null; rebuild(); renderAll();
      toast(pulled ? 'Signed in. Settings loaded from your account' : 'Signed in. Settings will sync');
      if (pulled && S.icuKey) sync();
    } catch (e) { m.textContent = e.message || 'Sign-in failed'; }
    return;
  }
  if (a === 'signout') { try { await SB.auth.signOut(); } catch (_) {} session = null; renderSetup(); return; }
});
document.addEventListener('input', ev => {
  if (ev.target.id === 'fHours') $('fHoursOut').textContent = ev.target.value + ' h';
});
document.addEventListener('change', ev => {
  if (ev.target.id === 'autoPush') {
    saveSettings({ autoPush: ev.target.checked });
    if (ev.target.checked) pushCalendar({ quiet: true }); else renderPlan();
  }
});
$('syncBtn').addEventListener('click', () => sync());
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (['today', 'plan', 'fitness', 'setup'].includes(h) && h !== UI.tab) go(h); });
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (UI.tab === 'fitness') renderPmc(); }, 150); });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && S.icuKey && (!D || Date.now() - (D.fetchedAt || 0) > 10 * 60000)) sync({ quiet: true });
});

/* --------------------------------------------------------------- boot */
(async function boot(){
  const h = location.hash.slice(1);
  if (['today', 'plan', 'fitness', 'setup'].includes(h)) UI.tab = h;
  if (!S.configured && !h) UI.tab = 'today';
  rebuild(); renderAll();
  await initAuth();
  rebuild(); renderAll();
  if (S.icuKey) sync({ quiet: !!D });
})();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
})();
</script>
